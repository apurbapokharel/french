name: ai

on:
  push:
    branches: [main]
    paths:
      - "ai/**"
      - "api/openapi.yaml"
      - ".github/workflows/ai-ci.yml"
  pull_request:
    paths:
      - "ai/**"
      - "api/openapi.yaml"
      - ".github/workflows/ai-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv tool install ./ai
      - name: Serve and check health
        run: |
          french-ai serve &
          for i in $(seq 30); do
            curl -sf http://127.0.0.1:8765/v1/health && exit 0
            sleep 1
          done
          exit 1
